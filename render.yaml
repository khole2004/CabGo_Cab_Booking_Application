services:
  # -------------------------------------------------------------
  # Backend Web Service (Spring Boot 3 + Eclipse Temurin 17)
  # -------------------------------------------------------------
  - type: web
    name: cabgo-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/vehicles
    envVars:
      - key: PORT
        value: 8088
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: cabgo-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://cabgo-frontend.onrender.com,http://localhost:5173

  # -------------------------------------------------------------
  # Frontend Static Site (React + Vite SPA)
  # -------------------------------------------------------------
  - type: web
    name: cabgo-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://cabgo-backend.onrender.com/api

# ---------------------------------------------------------------
# Managed PostgreSQL Database
# ---------------------------------------------------------------
databases:
  - name: cabgo-db
    plan: free
    region: oregon
    databaseName: cabgo_db
    user: cabgo
