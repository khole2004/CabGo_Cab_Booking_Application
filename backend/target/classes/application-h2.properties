# ==========================================================
# In-Memory H2 Profile for Local Zero-Config Testing
# Run with: .\mvnw spring-boot:run -Dspring-boot.run.profiles=h2
# ==========================================================
spring.datasource.url=jdbc:h2:mem:cabgo_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Flyway disabled for H2 mode (schema initialized directly from JPA or init script)
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update