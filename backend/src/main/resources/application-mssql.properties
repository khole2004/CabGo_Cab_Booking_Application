# ==========================================================
# CabGo - Microsoft SQL Server (MSSQL) Profile
# Activate with: --spring.profiles.active=mssql
# ==========================================================
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=cabgo_db;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:YourStrong@Passw0rd}

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
