# ==========================================================
# CabGo - PostgreSQL Profile for Cloud Deployment (Render)
# Activate with: --spring.profiles.active=postgres
# ==========================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cabgo_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# HikariCP Connection Pool Optimized for Cloud Free Tier (Render 512MB RAM)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# JPA / Hibernate Configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway disabled for PostgreSQL profile (Flyway scripts in this repo use MSSQL T-SQL syntax)
# Schema is generated and updated automatically by Hibernate; DataInitializer seeds the initial demo data
spring.flyway.enabled=false
