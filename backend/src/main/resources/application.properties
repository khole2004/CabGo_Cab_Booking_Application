# ==========================================================
# CabGo Application Configuration
# ==========================================================
server.port=${PORT:8088}
spring.application.name=cabgo-backend

# ----------------------------------------------------------
# Default Active Profile:
# 'mssql' -> Microsoft SQL Server with Flyway migrations
# 'h2'    -> Instant zero-config in-memory database with preloaded demo data
# ----------------------------------------------------------
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mssql}

# ----------------------------------------------------------
# Security & JWT Configuration
# ----------------------------------------------------------
cabgo.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B597036
cabgo.jwt.expiration-ms=86400000

# ----------------------------------------------------------
# CORS Configuration
# ----------------------------------------------------------
cabgo.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
